# PopOS defaults
vm.swappiness = 180                   # Controls the swappiness of the system
vm.watermark_boost_factor = 0         # Kernel memory management under load
vm.watermark_scale_factor = 125       # Impacts memory availability thresholds
vm.page-cluster = 0                   # Number of pages written to swap at once

# SteamOS default
vm.max_map_count = 2147483642         # Max memory map areas per process

# VFS cache tuning
vm.vfs_cache_pressure = 66            # Balances VFS cache reclaim aggressiveness

# File system tuning
fs.inotify.max_user_instances = 1024  # Max inotify instances per user (file-watchers, IDEs, KDE)
